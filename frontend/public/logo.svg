<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Shield Base Background -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer Glowing Shield Contour -->
  <path d="M 250 80 C 340 80 400 110 400 230 C 400 350 300 410 250 430 C 200 410 100 350 100 230 C 100 110 160 80 250 80 Z" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="12" filter="url(#glow)"/>

  <!-- Pulse Wave Heartbeat FHR Line -->
  <path d="M 120 250 L 190 250 L 210 180 L 230 310 L 255 210 L 275 270 L 290 250 L 380 250" 
        fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Mother & Fetus Silhouette Icon Center -->
  <circle cx="250" cy="180" r="28" fill="#10b981" filter="url(#glow)"/>
  <path d="M 220 230 C 220 200 280 200 280 230 C 280 280 220 280 220 230 Z" fill="#38bdf8" opacity="0.8"/>
  
  <!-- Text Label -->
  <text x="250" y="470" font-family="'Inter', sans-serif" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">FETALGUARD AI</text>
</svg>
