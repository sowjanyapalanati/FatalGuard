services:
  # ── AI Inference Service ────────────────────────────────────
  - type: web
    name: fetalguard-ai-inference
    env: python
    region: oregon
    buildCommand: pip install -r ai_inference_service/requirements.txt
    startCommand: uvicorn ai_inference_service.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODELS_DIR
        value: ml_pipeline/models
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"

  # ── Patient Service ─────────────────────────────────────────
  - type: web
    name: fetalguard-patient-service
    env: python
    region: oregon
    buildCommand: pip install -r patient_service/requirements.txt
    startCommand: uvicorn patient_service.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
