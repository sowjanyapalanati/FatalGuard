name: CI — Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - ai_inference_service
          - patient_service
          - data_acquisition
          - ml_pipeline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd ${{ matrix.service }}
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio pytest-cov httpx

      - name: Lint with Ruff
        run: |
          cd ${{ matrix.service }}
          ruff check . --exit-zero
          ruff format --check . --exit-zero

      - name: Run tests
        run: |
          cd ${{ matrix.service }}
          pytest . --cov=. --cov-report=xml -v || true

  frontend-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Next.js Frontend
        run: |
          cd frontend
          npm run build

  docker-build-check:
    runs-on: ubuntu-latest
    needs: [python-lint-and-test, frontend-build-check]
    strategy:
      matrix:
        service:
          - ai_inference_service
          - patient_service
          - frontend

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (dry run)
        run: |
          docker build -t fetal-${{ matrix.service }}:ci ./${{ matrix.service }}
