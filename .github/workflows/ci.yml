name: CI — Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ai_inference_service
            test_file: tests/test_ai_service.py
          - service: patient_service
            test_file: tests/test_patient_service.py
          - service: data_acquisition
            test_file: tests/test_ml_pipeline.py
          - service: ml_pipeline
            test_file: tests/test_ml_pipeline.py

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.service }}/requirements.txt
          pip install ruff pytest pytest-asyncio pytest-cov httpx

      - name: Lint with Ruff
        run: |
          ruff check ${{ matrix.service }} --exit-zero
          ruff format --check ${{ matrix.service }} --exit-zero

      - name: Run tests
        run: |
          PYTHONPATH=. pytest ${{ matrix.test_file }} --cov=${{ matrix.service }} --cov-report=xml -v

  frontend-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Next.js Frontend
        run: |
          cd frontend
          npm run build

  docker-build-check:
    runs-on: ubuntu-latest
    needs: [python-lint-and-test, frontend-build-check]
    strategy:
      fail-fast: false
      matrix:
        service:
          - ai_inference_service
          - patient_service
          - frontend

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (dry run)
        run: |
          docker build -t fetal-${{ matrix.service }}:ci ./${{ matrix.service }}

