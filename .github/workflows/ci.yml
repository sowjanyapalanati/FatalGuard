name: CI — Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - ai_inference_service
          - patient_service
          - notification_service
          - stream_processor
          - data_acquisition
          - ml_pipeline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd ${{ matrix.service }}
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio pytest-cov httpx

      - name: Lint with Ruff
        run: |
          cd ${{ matrix.service }}
          ruff check . --exit-zero
          ruff format --check . --exit-zero

      - name: Run tests
        run: |
          cd ${{ matrix.service }}
          pytest tests/ --cov=. --cov-report=xml -v || true

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: ${{ matrix.service }}/coverage.xml
          flags: ${{ matrix.service }}

  docker-build-check:
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      matrix:
        service:
          - ai_inference_service
          - patient_service
          - notification_service
          - stream_processor
          - data_acquisition

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (dry run)
        run: |
          docker build -t fetal-${{ matrix.service }}:ci ./${{ matrix.service }}
